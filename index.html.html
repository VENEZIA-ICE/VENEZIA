function pdfEnc(t){const m={"–":150,"—":151,"•":149,"’":146,"‘":145,"“":147,"”":148,"€":128,"…":133,"œ":156,"Œ":140};let o="";
 for(const ch of String(t).replace(/[\u202f\u00a0]/g," ")){let c=ch.charCodeAt(0);if(m[ch])c=m[ch];else if(c>255)c=63;o+=String.fromCharCode(c)}
 return o.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)")}
function pdfFile(pages){const objs=[],add=x=>{objs.push(x);return objs.length};
 add("<< /Type /Catalog /Pages 2 0 R >>");add("");
 add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
 add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
 const kids=[];
 pages.forEach(c=>{const cid=objs.length+2,pid=add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+cid+" 0 R >>");kids.push(pid+" 0 R");add("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream")});
 objs[1]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+pages.length+" >>";
 let out="%PDF-1.4\n",off=[];objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+" 0 obj\n"+o+"\nendobj\n"});
 const x=out.length;out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n"+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+x+"\n%%EOF";
 const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}

 newPage();c+=logo(y);
 const X=M+94;
 c+=T(X,y-20,"BON DE COMMANDE",18,1,PINK)+T(X,y-38,"Venezia Ice Bouskoura",11,1)+T(X,y-56,"N° "+b.no,13,1)+T(X,y-72,"Date : "+fd(b.date)+"     Livraison prévue : "+(b.livPrev?fd(b.livPrev):"-"),10,0,"0.3 0.3 0.3");
 y=y-76-16;c+=PINK+" RG 2 w "+M+" "+y+" m "+(595-M)+" "+y+" l S\n";y-=26;
 c+=T(M,y,"Fournisseur : "+s.nom,13,1,PINK);y-=18;
 const ct=[s.contact,s.tel,s.ville].filter(Boolean).join("   -   ");if(ct){c+=T(M,y,ct,10,0,"0.3 0.3 0.3");y-=14}

let invDr={},invD=today(),invRep=null,invCFs="",invMsg="";
function invSorted(){return S.inv.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)}
function invSet(aid,v){if(v===""||v==null)delete invDr[aid];else invDr[aid]=Math.max(0,parseFloat(v)||0);
 const e=$("ie"+aid);if(e){if(invDr[aid]==null){e.textContent="";e.className="n"}else{const d=invDr[aid]-calc(aid,invD).q;e.textContent=(d>0?"+":"")+fmt(d);e.className="n "+(d<0?"out":d>0?"in":"")}}
 const n=$("invn");if(n)n.textContent=Object.keys(invDr).length+" article(s) compté(s)"}
function invFilter(){const v=($("iq")||{value:""}).value.toLowerCase().trim(),f=($("ifs")||{value:""}).value;
 document.querySelectorAll("#invt tr[data-q]").forEach(r=>{r.style.display=(!v||r.dataset.q.includes(v))&&(!f||r.dataset.f===f)?"":"none"})}

function invValidate(){
 if(!can("mov")){alert("Vous n’avez pas l’autorisation d’enregistrer un inventaire.");return}
 const ids=Object.keys(invDr).map(Number).filter(i=>art(i));if(!ids.length){alert("Saisissez au moins une quantité comptée.");return}
 const d=invD||today(),L0=invSorted(),last=L0[L0.length-1];
 if(last&&d<last.date){alert("La date doit être postérieure ou égale à celle du dernier inventaire ("+fd(last.date)+").");return}
 if(!confirm("Valider l’inventaire du "+fd(d)+" ("+ids.length+" article(s)) ?\n\nLe stock de ces articles sera remplacé par les quantités comptées : il devient le stock initial de la période suivante. L’écart avec le stock théorique est enregistré dans la fiche de stock (sortie = consommation)."))return;
 const n=S.inv.filter(x=>x.date===d).length+1,no="INV"+d.replace(/-/g,"")+"-"+String(n).padStart(2,"0"),id=uid(),lines=[];let nd=0;
 ids.forEach(i=>{const a=art(i),c=calc(i,d),cnt=invDr[i],diff=cnt-c.q;lines.push({aid:i,ref:a.ref,des:a.des,unite:a.unite,theo:c.q,cnt,pu:c.c});
  if(diff<-1e-9){S.mov.push({id:uid(),date:d,aid:i,type:"S",qte:-diff,pu:c.c,note:"Inventaire "+no+" (consommation)",par:who(),inv:id});nd++}
  else if(diff>1e-9){S.mov.push({id:uid(),date:d,aid:i,type:"E",qte:diff,pu:c.c,note:"Inventaire "+no+" (régularisation)",par:who(),inv:id});nd++}});

 invMsg="Inventaire "+no+" enregistré : "+ids.length+" article(s) comptés, "+nd+" écart(s) inscrit(s) dans la fiche de stock.";render()}
function invDel(id){const L=invSorted(),last=L[L.length-1];
 if(!last||last.id!=id){alert("Seul le dernier inventaire peut être supprimé.");return}
 if(confirm("Supprimer l’inventaire "+last.no+" et ses écarts dans la fiche de stock ?")){S.mov=S.mov.filter(m=>m.inv!=id);S.inv=S.inv.filter(x=>x.id!=id);if(invRep==id)invRep=null;save();render()}}
function invConso(i2){const L=invSorted(),k=L.findIndex(x=>x.id==i2.id);if(k<1)return null;const i1=L[k-1],rows=[];
 i2.lines.forEach(l2=>{const a=art(l2.aid);if(!a)return;
  const o=calc(a.id,i1.date),E=S.mov.filter(m=>m.aid==a.id&&m.type==="E"&&!m.inv&&m.date>i1.date&&m.date<=i2.date),

is)</b></td><td class="n ${op+sc("sol")<-0.005?"out":""}"><b>${mad(op+sc("sol"))}</b></td></tr></table></div>`:`<div class="empty">Aucune journée enregistrée pour ce mois.</div>`)+`</div>`;
 return h+jrChart(m)}

function addMov(){const q=parseFloat($("mq").value);
